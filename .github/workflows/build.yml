name: Compilar APK
on:
  workflow_dispatch:
  push:
    paths:
      - "launcher-v4.zip"
      - ".github/workflows/build.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar SDK de Android
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;33.0.2" > /dev/null || true
      - name: Descomprimir proyecto
        run: unzip -q launcher-v4.zip -d proj
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"
      - name: Compilar
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: proj/app/build/outputs/apk/debug/*.apk
